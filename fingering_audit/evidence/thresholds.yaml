schema_version: 1
sources_bib: sources.bib
pig:
  version: "1.02"
  official_page: https://beam.kisarazu.ac.jp/~saito/research/PianoFingeringDataset/
  acquisition: upon_request
  checksum: null
  policy: >-
    The official page does not publish a direct archive plus checksum. The
    pipeline therefore discovers a complete local copy and otherwise fails
    closed instead of downloading an unverifiable mirror.

rules:
  - rule_id: missing_or_invalid_prediction
    kind: risk
    feature: prediction_is_missing_or_out_of_domain
    unit: boolean
    operator: is_true
    evidence_grade: physical_invariant
    source_keys: [pig_dataset_v102]
    applicability: all_pianovam_notes
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      Hand must be L/R and finger must be 1..5 for the published label to be
      complete. This is a schema-integrity condition, not a claim that a
      pianist's observed action was invalid.
    sensitivity_variants:
      exact: {value: true}

  - rule_id: pair_span_difficulty
    kind: risk
    feature: directed_same_hand_finger_pair_span
    unit: semitones
    operator: outside_pair_specific_interval
    evidence_grade: research_supported
    source_keys: [parncutt1997ergonomic]
    applicability: consecutive_same_hand_melodic_notes
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      Parncutt et al. Table 1 supplies directed Min/Max comfortable, relative,
      and practical spans. Exceeding a table boundary indicates ergonomic
      difficulty, never logical invalidity.
    sensitivity_variants:
      conservative_max_practical:
        bounds:
          "1-2": [-5, 10]
          "1-3": [-4, 12]
          "1-4": [-3, 14]
          "1-5": [-1, 15]
          "2-3": [1, 5]
          "2-4": [1, 7]
          "2-5": [2, 10]
          "3-4": [1, 4]
          "3-5": [1, 7]
          "4-5": [1, 5]
      central_max_comfortable:
        bounds:
          "1-2": [-3, 8]
          "1-3": [-2, 10]
          "1-4": [-1, 12]
          "1-5": [1, 13]
          "2-3": [1, 3]
          "2-4": [1, 5]
          "2-5": [2, 8]
          "3-4": [1, 2]
          "3-5": [1, 5]
          "4-5": [1, 3]
      sensitive_max_relative:
        bounds:
          "1-2": [1, 5]
          "1-3": [3, 7]
          "1-4": [5, 9]
          "1-5": [7, 10]
          "2-3": [1, 2]
          "2-4": [3, 4]
          "2-5": [5, 6]
          "3-4": [1, 2]
          "3-5": [3, 4]
          "4-5": [1, 2]
    source_locator:
      page: 345
      table: 1
      population_or_basis: >-
        Ergonomic model synthesized from prior biomechanical measurements and
        piano pedagogical sources; tested on short right-hand Czerny fragments.
      limitations: >-
        Consecutive, right-hand, legato, moderately loud, isochronous melodic
        fragments; no duration, articulation, individual hand size, or
        two-hand interaction.

  - rule_id: non_thumb_crossing
    kind: risk
    feature: pitch_direction_opposes_finger_direction_without_thumb_and_short_ioi
    unit: boolean_and_milliseconds
    operator: is_true_and_ioi_at_most
    evidence_grade: research_supported
    source_keys: [parncutt1997ergonomic]
    applicability: consecutive_same_hand_notes
    may_select_alone: false
    implementation_version: 2
    rationale: >-
      The ergonomic model excludes these crossings as generally impractical
      but explicitly discusses valid historical and virtuoso exceptions.
      Therefore this signal requires corroboration and cannot be invalidity.
      The inclusive 1000 ms audit cap is a user-specified conservative policy,
      not a published physical or ergonomic threshold; the uncapped relation
      remains available as a diagnostic feature.
    sensitivity_variants:
      audit_policy:
        relation: true
        max_prev_ioi_ms: 1000
        inclusive: true
        exploratory_cutoff: true

  - rule_id: time_conditioned_large_position_change
    kind: risk
    feature: absolute_pitch_change_conditioned_on_inter_onset_time
    unit: semitones_and_milliseconds
    operator: joint_fold_calibrated_tail
    evidence_grade: empirically_calibrated
    source_keys: [parncutt1997ergonomic, bates2021risk]
    applicability: consecutive_same_hand_notes
    may_select_alone: false
    implementation_version: 1
    rationale: >-
      No primary source reviewed supplies a universal piano-video cutoff that
      jointly maps leap size and available time to error probability. Fit only
      on the training recordings of each leave-one-recording-out fold.
    sensitivity_variants:
      conservative: {training_tail_quantile: 0.995}
      central: {training_tail_quantile: 0.990}
      sensitive: {training_tail_quantile: 0.975}

  - rule_id: rapid_repetition_or_alternation
    kind: risk
    feature: repeated_pitch_or_alternating_finger_rate
    unit: milliseconds
    operator: below_fold_calibrated_quantile
    evidence_grade: empirically_calibrated
    source_keys: [nakamura2020statistical, bates2021risk]
    applicability: sequential_same_hand_notes
    may_select_alone: false
    implementation_version: 1
    rationale: >-
      The existing 120 ms cutoff has no cited universal basis. The replacement
      is fitted within each training fold and needs an independent signal.
    sensitivity_variants:
      conservative: {training_error_enrichment_quantile: 0.01}
      central: {training_error_enrichment_quantile: 0.025}
      sensitive: {training_error_enrichment_quantile: 0.05}

  - rule_id: hmm_detector_disagreement
    kind: risk
    feature: detector_label_differs_from_pig_trained_hmm
    unit: categorical
    operator: not_equal
    evidence_grade: research_supported
    source_keys: [nakamura2020statistical]
    applicability: notes_with_both_predictions
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      PIG-trained higher-order HMMs are competitive fingering estimators, but
      human fingering varies and the model omits phrase boundaries and hand
      interdependence. Disagreement is error risk, not proof of which label is
      wrong.
    sensitivity_variants:
      hand_disagreement_only: {levels: [hand]}
      exact_disagreement: {levels: [hand, within_hand_finger]}

  - rule_id: detector_low_support
    kind: risk
    feature: detector_temporal_support_fraction
    unit: fraction
    operator: below_training_fold_cutoff
    evidence_grade: empirically_calibrated
    source_keys: [zhang2020mediapipe, pavlakos2024hamer, bates2021risk]
    applicability: notes_with_detector_candidates
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      0.50 and 0.80 are legacy algorithm tiers, not published piano error
      thresholds. Calibrate from authoritative training-fold errors while
      retaining them only as named historical baselines.
    sensitivity_variants:
      conservative: {max_training_false_discovery_rate: 0.10}
      central: {max_training_false_discovery_rate: 0.15}
      sensitive: {max_training_false_discovery_rate: 0.20}
      legacy_050: {support_lt: 0.50, exploratory_baseline: true}
      legacy_080: {support_lt: 0.80, exploratory_baseline: true}

  - rule_id: detector_small_margin
    kind: risk
    feature: detector_top_two_score_margin
    unit: detector_score
    operator: below_training_fold_cutoff
    evidence_grade: empirically_calibrated
    source_keys: [pavlakos2024hamer, bates2021risk]
    applicability: notes_with_two_or_more_candidates
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      HaMeR does not publish a piano-fingering candidate-margin threshold.
      Calibrate the margin using training recordings only.
    sensitivity_variants:
      conservative: {max_training_false_discovery_rate: 0.10}
      central: {max_training_false_discovery_rate: 0.15}
      sensitive: {max_training_false_discovery_rate: 0.20}

  - rule_id: missing_hand_or_landmark_run
    kind: risk
    feature: within_note_missing_hand_or_landmark_fraction
    unit: fraction_and_frames
    operator: training_fold_calibrated
    evidence_grade: empirically_calibrated
    source_keys: [zhang2020mediapipe, pavlakos2024hamer, bates2021risk]
    applicability: notes_with_video_frame_coverage
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      Missing tracking is directly relevant to detector reliability, but the
      papers provide no universal piano-specific duration. The existing
      three-note Noinfo cluster remains an exploratory baseline only.
    sensitivity_variants:
      conservative: {max_training_false_discovery_rate: 0.10}
      central: {max_training_false_discovery_rate: 0.15}
      sensitive: {max_training_false_discovery_rate: 0.20}
      legacy_three_note_cluster: {consecutive_notes_gte: 3, exploratory_baseline: true}

  - rule_id: handedness_flip
    kind: risk
    feature: within_note_or_adjacent_frame_handedness_flip
    unit: count
    operator: greater_than
    evidence_grade: research_supported
    source_keys: [zhang2020mediapipe, pavlakos2024hamer]
    applicability: notes_with_handedness_trajectory
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      A handedness change within one continuous tracked hand trajectory is an
      internal inconsistency. Count thresholds beyond the first flip are
      sensitivity variants, not anatomical claims.
    sensitivity_variants:
      conservative: {count_gt: 2}
      central: {count_gt: 1}
      sensitive: {count_gt: 0}

  - rule_id: pig_unseen_local_transition
    kind: risk
    feature: pig_transition_support_count
    unit: annotation_count
    operator: less_than_or_equal
    evidence_grade: empirically_calibrated
    source_keys: [pig_dataset_v102, nakamura2020statistical]
    applicability: sequential_same_hand_notes_with_complete_pig_control
    may_select_alone: false
    implementation_version: 1
    rationale: >-
      Absence or rarity in PIG is not invalidity because of finite coverage and
      legitimate individual variation. It can only corroborate another signal.
    sensitivity_variants:
      unseen_only: {support_lte: 0}
      singleton: {support_lte: 1}
      rare: {support_lte: 2}

  - rule_id: simultaneous_same_finger_different_pitch
    kind: invalidity
    feature: simultaneous_same_finger_different_pitch
    unit: boolean
    operator: is_true
    evidence_grade: physical_invariant
    source_keys: [pig_dataset_v102]
    applicability: valid_assigned_same_hand_overlapping_keys
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      Two separated keys assigned to the same within-hand finger during a
      strict key-depression overlap are a physical contradiction. PIG is
      authoritative for validation, and pairs involving a compound fingering
      token are conservatively excluded so finger-substitution semantics are
      not flattened to the token's first component.
    sensitivity_variants:
      strict_overlap_1ms: {timing_epsilon_sec: 0.001}

  - rule_id: simultaneous_pair_span
    kind: invalidity
    feature: simultaneous_pair_span_beyond_policy
    unit: semitones
    operator: strictly_greater_than_pair_boundary
    evidence_grade: physical_invariant
    source_keys: [parncutt1997ergonomic, pig_dataset_v102]
    applicability: valid_assigned_same_hand_overlapping_keys
    may_select_alone: true
    implementation_version: 1
    rationale: >-
      The PIG-authorized boundary is the maximum of the absolute published
      MinPrac and MaxPrac limits and the largest valid simultaneous span
      observed in PIG. Equality is accepted, and no boundary is asserted for
      a pair without PIG simultaneous coverage. This conservative policy is
      an audit contradiction, not a universal anatomical limit.
    sensitivity_variants:
      pig_authorized_max: {timing_epsilon_sec: 0.001}
